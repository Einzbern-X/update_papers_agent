# 论文全量爬取配置
# 输出字段固定为：
# venue, year, title, authors, pdf_url, source_url
#
# 注意：
# 1. CVF / NeurIPS / IJCAI / KDD / ACM MM 等 HTML 页面可直接通过 url 爬。
# 2. OpenReview 推荐填写 openreview_invitation。不同会议 invitation 可能不同，需要按实际页面调整。
# 3. ACM DL 页面常有访问限制，建议只作为补充源，不建议作为唯一源。

database:
  path: "data/papers.db"

export:
  path: "exports/all_papers.csv"

request:
  timeout: 30
  sleep_seconds: 0.2

sources:
  # =========================
  # CVF: CVPR / ICCV / WACV / ACCV
  # =========================
  - name: "CVPR 2026 CVF"
    venue: "CVPR"
    year: 2026
    url: "https://openaccess.thecvf.com/CVPR2026?day=all"
    parser: "cvf"
    enabled: true

  - name: "ICCV 2025 CVF"
    venue: "ICCV"
    year: 2025
    url: "https://openaccess.thecvf.com/ICCV2025?day=all"
    parser: "cvf"
    enabled: true

  # =========================
  # OpenReview: ICLR / ICML / NeurIPS / ECCV 等
  # 如果 invitation 写错，程序会在日志里提示失败。
  # =========================
  - name: "ICLR 2026 OpenReview"
    venue: "ICLR"
    year: 2026
    parser: "openreview"
    source_url: "https://openreview.net/group?id=ICLR.cc/2026/Conference"
    openreview_invitation: "ICLR.cc/2026/Conference/-/Submission"
    enabled: true

  - name: "ICML 2026 OpenReview"
    venue: "ICML"
    year: 2026
    parser: "openreview"
    source_url: "https://openreview.net/group?id=ICML.cc/2026/Conference"
    openreview_invitation: "ICML.cc/2026/Conference/-/Submission"
    enabled: true

  - name: "NeurIPS 2026 OpenReview"
    venue: "NeurIPS"
    year: 2026
    parser: "openreview"
    source_url: "https://openreview.net/group?id=NeurIPS.cc/2026/Conference"
    openreview_invitation: "NeurIPS.cc/2026/Conference/-/Submission"
    enabled: true

  # =========================
  # NeurIPS Proceedings
  # =========================
  - name: "NeurIPS 2025 Proceedings"
    venue: "NeurIPS"
    year: 2025
    url: "https://proceedings.neurips.cc/paper_files/paper/2025"
    parser: "neurips"
    enabled: true

  # =========================
  # IJCAI Proceedings
  # =========================
  - name: "IJCAI 2025 Proceedings"
    venue: "IJCAI"
    year: 2025
    url: "https://www.ijcai.org/proceedings/2025/"
    parser: "ijcai"
    enabled: true

  # =========================
  # ACM MM
  # =========================
  - name: "ACM MM 2025 Regular Papers"
    venue: "ACM MM"
    year: 2025
    url: "https://acmmm2025.org/accepted-regular-papers/"
    parser: "acmmm"
    enabled: true

  # =========================
  # KDD / SIGKDD
  # =========================
  - name: "KDD 2025 Research Track"
    venue: "KDD"
    year: 2025
    url: "https://kdd2025.kdd.org/research-track-papers-2/"
    parser: "kdd"
    enabled: true

  - name: "KDD 2025 ADS Track"
    venue: "KDD"
    year: 2025
    url: "https://kdd2025.kdd.org/applied-data-science-ads-track-papers-2/"
    parser: "kdd"
    enabled: true

  # =========================
  # SIGGRAPH / SIGGRAPH Asia
  # Ke-Sen 页面通常比较适合抽 title / authors / pdf / doi
  # =========================
  - name: "SIGGRAPH Asia 2025 Ke-Sen"
    venue: "SIGGRAPH Asia"
    year: 2025
    url: "https://www.realtimerendering.com/kesen/siga2025Papers.htm"
    parser: "siggraph"
    enabled: true

  # 兜底示例：如果某个会议没有专用 parser，可以先用 generic
  # - name: "Some Conference 2026"
  #   venue: "SomeConf"
  #   year: 2026
  #   url: "https://example.com/accepted-papers"
  #   parser: "generic"
  #   enabled: false
