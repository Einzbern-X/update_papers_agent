# 论文放榜监测 Agent 配置
# 保存字段：venue, year, title, authors, pdf_url, source_url

request:
  timeout: 30
  sleep_seconds: 0.2
  user_agent: "Mozilla/5.0 PaperCrawlerAgent/1.0"

database:
  path: "data/papers.db"

export:
  path: "exports/all_papers.csv"

llm:
  enabled: true
  provider: "openai_compatible"
  model: "kimi-k2.6"
  api_key_env: "MOONSHOT_API_KEY"
  base_url_env: "MOONSHOT_BASE_URL"
  temperature: 0.6
  max_tokens: 4096
  timeout: 60
  max_html_chars: 30000
agent:
  # variable 来源：先让大模型判断是否放榜；如果放榜但固定 parser 失败，再让大模型生成临时解析规则
  llm_judge_release_for_variable: true
  auto_generate_rules: true
  save_generated_rules: true
  generated_rules_path: "runtime_rules/generated_rules.yaml"
  # 大模型生成定制爬取脚本的持久化路径（新策略）
  generated_scripts_path: "runtime_rules/generated_scripts.yaml"
  min_valid_paper_count: 5
  min_title_ratio: 0.90
  # 已成功爬取过的 source 不再重复爬（true=跳过，false=每次都重跑）
  skip_done_sources: true
  # 脚本执行结果有问题时，最多让大模型自动修复几轮（Reflection 循环）
  max_reflection_rounds: 2

sources:
  - name: "KDD 2024 Research Track"
    venue: "KDD"
    year: 2024
    url: "https://kdd2024.kdd.org/research-track-papers/"
    parser: "generic"
    structure_type: "variable"
    use_llm: true
    skip_url_search: true   # URL 已知有效，跳过 Phase1 联网搜索
    enabled: true
    search_query: "KDD 2024 accepted research papers list official site"
  # 2026
  - name: "ECCV 2026 ECVA Papers"
    venue: "ECCV"
    year: 2026
    url: "https://www.ecva.net/papers.php"
    parser: "ecva"
    structure_type: "stable"
    use_llm: false
    enabled: true

